name: readme-pdf

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render README.pdf
        run: |
          npx --yes md-to-pdf README.md \
            --launch-options '{"args":["--no-sandbox"]}' \
            --pdf-options '{"format":"Letter","margin":{"top":"0.75in","bottom":"0.75in","left":"0.75in","right":"0.75in"},"printBackground":true}'

      - name: Commit README.pdf if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Auto-regenerate README.pdf from README.md"
            git push
          fi
