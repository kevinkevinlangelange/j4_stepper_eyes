; PlatformIO Project Configuration File
;
; --------------------------------------------------
;  j4_stepper_eyes / ESP32-DEV (WROOM)
;  Eye-pop stepper board for Johnny 4 and the last node
;  of the stepper daisy chain.
;    2x TMC2209 (eye-pop left + right, independent
;    step/dir, commanded identically)
;  Receives the eye value from j4_stepper_neck over
;  UART1, drives both eyes, and reports driver status
;  back upstream.
; --------------------------------------------------
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    gin66/FastAccelStepper@^0.30.7
    teemuatlut/TMCStepper@^0.7.3
